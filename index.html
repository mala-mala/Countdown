<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="17:15の業務終了までを表示するiPad向けカウントダウンアプリ" />
    <meta name="theme-color" content="#101418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="終業カウント" />
    <title>業務終了カウントダウン</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 画像が読み込まれるまでは、曜日ごとのグラデーション背景を表示します。 -->
    <div class="background-photo" id="backgroundPhoto" aria-hidden="true"></div>
    <div class="screen-overlay" aria-hidden="true"></div>

    <main class="app-shell">
      <section class="countdown" aria-label="業務終了カウントダウン">
        <p class="date-label" id="dateLabel">読み込み中</p>
        <h1 class="main-title" id="mainTitle">業務終了まで</h1>
        <time class="clock" id="clock" datetime="PT0S">--:--:--</time>
        <p class="status-message" id="statusMessage">少しだけお待ちください</p>
        <p class="sub-message" id="subMessage">今日の残り時間を確認しています</p>
      </section>
    </main>

    <footer class="progress-area" aria-label="業務時間の進捗">
      <div class="progress-text">
        <span id="progressLabel">今日の進み具合</span>
        <span id="progressPercent">0%</span>
      </div>
      <div
        class="progress-track"
        id="progressTrack"
        role="progressbar"
        aria-label="8時15分から17時15分までの進捗"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </footer>

    <a class="photo-credit" id="photoCredit" href="#" target="_blank" rel="noopener noreferrer" hidden>
      Photo by Unsplash
    </a>

    <script src="./script.js" defer></script>
  </body>
</html>
